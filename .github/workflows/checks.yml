name: Checks

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: Run checks
        run: scripts/check.sh

      - name: Send Telegram message
        if: always() && github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets are not configured; skipping notification"
            exit 0
          fi

          [[ "${{ job.status }}" == "success" ]] && STATUS="✅" || STATUS="❌"
          REPOSITORY="${GITHUB_REPOSITORY#*/}"
          MESSAGE="\`\`\`
          action         : Dotfiles checks
          repository     : ${REPOSITORY}
          commit message : ${COMMIT_MESSAGE}
          status         : ${STATUS}
          \`\`\`
          See logs [here](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"

          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode=Markdown \
            || echo "Telegram notification failed"
